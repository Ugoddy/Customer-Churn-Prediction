name: CI

# Runs on every push to main and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install pytest httpx

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build and smoke-test Docker images
    runs-on: ubuntu-latest
    needs: test          # only runs if the tests passed
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f Dockerfile.api -t churn-api .

      - name: Build the Streamlit image
        run: docker build -f Dockerfile.streamlit -t churn-ui .

      - name: Start the API container
        run: docker run -d --name api -p 8000:8000 churn-api

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs api; exit 1

      - name: Send a real prediction request
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"No","Dependents":"No","tenure":3,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":95.5,"TotalCharges":286.5}' \
            | tee response.json
          echo
          python3 -c "import json; r=json.load(open('response.json')); assert r['risk_level']=='high', r; print('Smoke test passed:', r)"
